<!DOCTYPE html>
<html>
<head>
  <title>Test API Endpoints</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
    button { margin: 5px; padding: 10px 20px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
    button:hover { background: #005a9e; }
    .result { margin: 10px 0; padding: 10px; background: #2d2d2d; border-radius: 4px; white-space: pre-wrap; }
    .error { color: #f48771; }
    .success { color: #4ec9b0; }
    input { padding: 8px; margin: 5px; background: #2d2d2d; border: 1px solid #555; color: white; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 Test Sahabat BK API</h1>
  
  <div>
    <h2>Environment</h2>
    <div id="env" class="result"></div>
  </div>

  <div>
    <h2>1. Test Health Check</h2>
    <button onclick="testHealth()">GET /api</button>
    <div id="health-result" class="result"></div>
  </div>

  <div>
    <h2>2. Test Register Student</h2>
    <input id="student-name" placeholder="Nama" value="Test Student">
    <input id="student-username" placeholder="Username" value="teststudent">
    <input id="student-password" placeholder="Password" value="password123">
    <input id="student-kelas" placeholder="Kelas" value="10A">
    <button onclick="testRegisterStudent()">POST /api/auth/register/student</button>
    <div id="register-student-result" class="result"></div>
  </div>

  <div>
    <h2>3. Test Login Student</h2>
    <input id="login-username" placeholder="Username" value="teststudent">
    <input id="login-password" placeholder="Password" value="password123">
    <button onclick="testLoginStudent()">POST /api/auth/login/student</button>
    <div id="login-student-result" class="result"></div>
  </div>

  <div>
    <h2>4. Raw Test (Check Headers & Response)</h2>
    <button onclick="testRaw()">Test Raw POST</button>
    <div id="raw-result" class="result"></div>
  </div>

  <script>
    // Force use production API (same domain)
    const API_URL = '/api';
    
    document.getElementById('env').textContent = `API URL: ${API_URL}\nHostname: ${window.location.hostname}\nFull URL: ${window.location.origin}${API_URL}`;

    async function testHealth() {
      const result = document.getElementById('health-result');
      try {
        result.textContent = 'Testing...';
        const response = await fetch(`${API_URL}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }
        
        result.className = response.ok ? 'result success' : 'result error';
        result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `ERROR: ${err.message}`;
      }
    }

    async function testRegisterStudent() {
      const result = document.getElementById('register-student-result');
      try {
        result.textContent = 'Testing...';
        
        const payload = {
          name: document.getElementById('student-name').value,
          username: document.getElementById('student-username').value,
          password: document.getElementById('student-password').value,
          kelas: document.getElementById('student-kelas').value,
          gender: 'male'
        };
        
        console.log('Sending:', payload);
        
        const response = await fetch(`${API_URL}/auth/register/student`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const text = await response.text();
        console.log('Response text:', text);
        
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { rawResponse: text };
        }
        
        result.className = response.ok ? 'result success' : 'result error';
        result.textContent = `Status: ${response.status}\nContent-Type: ${response.headers.get('content-type')}\n\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `ERROR: ${err.message}\nStack: ${err.stack}`;
      }
    }

    async function testLoginStudent() {
      const result = document.getElementById('login-student-result');
      try {
        result.textContent = 'Testing...';
        
        const payload = {
          username: document.getElementById('login-username').value,
          password: document.getElementById('login-password').value
        };
        
        console.log('Sending:', payload);
        
        const response = await fetch(`${API_URL}/auth/login/student`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const text = await response.text();
        console.log('Response text:', text);
        
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { rawResponse: text };
        }
        
        result.className = response.ok ? 'result success' : 'result error';
        result.textContent = `Status: ${response.status}\nContent-Type: ${response.headers.get('content-type')}\n\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `ERROR: ${err.message}`;
      }
    }

    async function testRaw() {
      const result = document.getElementById('raw-result');
      try {
        result.textContent = 'Testing raw POST...';
        
        const response = await fetch(`${API_URL}/auth/register/student`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            name: "Raw Test",
            username: "rawtest" + Date.now(),
            password: "password123",
            kelas: "10A"
          })
        });
        
        const headers = {};
        response.headers.forEach((value, key) => {
          headers[key] = value;
        });
        
        const text = await response.text();
        
        result.className = 'result';
        result.textContent = `Status: ${response.status} ${response.statusText}\n\nHeaders:\n${JSON.stringify(headers, null, 2)}\n\nBody:\n${text}`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `ERROR: ${err.message}`;
      }
    }
  </script>
</body>
</html>
